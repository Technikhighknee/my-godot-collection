# Canonical template: dev_tool/docs/ci/isolated-ci.yml
# Executable copy (.github/workflows/isolated-ci.yml) lives ONLY on CI.
# CI HEAD^ = exact source commit; CI HEAD = one workflow-only overlay commit.
name: Isolated repository verification

on:
  push:
    branches:
      - CI

permissions:
  contents: read

concurrency:
  group: isolated-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 22 / Typecheck + full tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate plus CI overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify the exact source commit
        shell: bash
        run: |
          echo "Source commit under test: $(git rev-parse HEAD^)"
          echo "CI overlay commit: $(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Validate isolated CI overlay
        shell: bash
        run: |
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ "$files" != ".github/workflows/isolated-ci.yml" ]; then
            echo "::error::CI overlay must only add .github/workflows/isolated-ci.yml"
            printf '%s\n' "$files"
            exit 1
          fi
          if [ -f dev_tool/docs/ci/isolated-ci.yml ]; then
            if ! cmp -s dev_tool/docs/ci/isolated-ci.yml .github/workflows/isolated-ci.yml; then
              echo "::error::Executable workflow differs from the canonical documentation template"
              exit 1
            fi
          else
            echo "::warning::Historical source commit has no documented CI template; use a trusted canonical template revision."
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev_tool/package-lock.json

      - name: Install locked dependencies
        id: install
        working-directory: dev_tool
        run: npm ci

      - name: Typecheck
        id: typecheck
        working-directory: dev_tool
        run: npm run typecheck

      - name: Full test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: dev_tool
        run: npm test
